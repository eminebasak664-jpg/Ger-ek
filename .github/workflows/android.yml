
name: Ja.i Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Ja.i_Android_*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4

      - name: En yeni Ja.i kaynak ZIP'ini seç
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(find . -maxdepth 1 -type f -name 'Ja.i_Android_*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [[ -z "$PACKAGE" ]]; then
            echo 'Ja.i kaynak ZIP bulunamadı.' >&2
            exit 1
          fi
          echo "file=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Android projesini aç
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.package.outputs.file }}" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK bileşenlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test ve APK derlemesi
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon validateAndroidResources testDebugUnitTest assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Ja.i-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
